# POps dashboard container: serves the PHP panel and reverse-proxies the backend container.
# /api, /ws (WebSocket), /updates and /download go to the backend; everything else is the
# panel. Plain HTTP only: terminate TLS in front of this container (see docs/docker.md).

ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Client address: X-Forwarded-For is honoured only from POPS_TRUSTED_PROXIES (set by the
# entrypoint; by default the container's gateway, i.e. a reverse proxy on the Docker host).
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy ${POPS_TRUSTED_PROXIES}

<VirtualHost *:80>
    DocumentRoot /var/www/html
    DirectoryIndex index.php

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    # JSON yanıtlarını sıkıştır (cihaz listesi büyük filolarda megabaytlarca)
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE application/json text/css application/javascript image/svg+xml
    </IfModule>
    # Temiz adresler: /devices -> devices.php (panelin bağlantıları .php'siz; .php adresleri de çalışır)
    RewriteEngine On
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI}.php -f
    RewriteRule "^/([A-Za-z0-9_-]+)$" "/$1.php" [L]

    # PHP include files are only ever included, never requested directly.
    <Directory /var/www/html/includes>
        Require all denied
    </Directory>

    # %a is the client address after mod_remoteip.
    LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" pops
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log pops

    # Request bodies stay small; only the two admin upload endpoints (deployment packages,
    # signed releases) accept large ones.
    LimitRequestBody 8388608
    <LocationMatch "^/api/(upload|system/upload-release)$">
        LimitRequestBody 629145600
    </LocationMatch>

    ProxyRequests Off
    ProxyPreserveHost On
    # The backend trusts X-Forwarded-For from this container, so it must carry exactly one
    # value: drop whatever the client sent; mod_proxy then adds the address resolved above.
    RequestHeader unset X-Forwarded-For

    # disablereuse=On resolves "backend" for every connection, so a recreated backend
    # container (new IP) is picked up without restarting this one.
    ProxyPass /ws/       ws://backend:8000/ws/        timeout=3600 disablereuse=On
    ProxyPass /api/      http://backend:8000/api/      disablereuse=On
    ProxyPass /updates/  http://backend:8000/updates/  disablereuse=On
    ProxyPass /download/ http://backend:8000/download/ disablereuse=On
</VirtualHost>
