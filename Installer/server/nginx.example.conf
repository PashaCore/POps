# POps — örnek nginx reverse proxy (install.sh backend'i 127.0.0.1:8000'de kurar).
# TLS'i certbot ile ekleyin: `certbot --nginx -d pops.example.com`. Ajan http'yi reddeder, wss şart.
# root'u kendi klonunuzun Dashboard/ yoluna güncelleyin. PHP-FPM soketi dağıtıma göre değişir.

server {
    listen 443 ssl http2;
    server_name pops.example.com;                     # <- kendi alan adınız

    ssl_certificate     /etc/letsencrypt/live/pops.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pops.example.com/privkey.pem;

    root  /opt/POps/Dashboard;                         # <- PHP panel docroot
    index index.php;
    client_max_body_size 8m;                           # büyük gövde yalnızca yükleme adreslerinde
    # JSON yanıtlarını sıkıştır (cihaz listesi 2.000 cihazda ~1,4 MB → ~50 KB)
    gzip on; gzip_proxied any; gzip_min_length 1024;
    gzip_types application/json text/css application/javascript image/svg+xml;

    # Dağıtım paketi + imzalı sürüm yükleme (yalnızca yönetici)
    location ~ ^/api/(upload|system/upload-release)$ {
        client_max_body_size 600m;
        proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
    }

    # Backend API
    location /api/      { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
    # WebSocket (ajan + panel) — upgrade başlıkları şart
    location /ws/       { proxy_pass http://127.0.0.1:8000; proxy_http_version 1.1;
                          proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade";
                          proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_read_timeout 3600s; }
    # İmzalı güncelleme paketleri + yüklemeler
    location /updates/  { proxy_pass http://127.0.0.1:8000; }
    location /download/ { proxy_pass http://127.0.0.1:8000; }

    # PHP panel
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php-fpm/www.sock;        # <- dağıtıma göre (php-fpm soketi)
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
    # Temiz adresler: /devices -> devices.php (panelin bağlantıları .php'siz; .php adresleri de çalışır)
    location / { try_files $uri $uri/ @pops_page; }
    location @pops_page { rewrite "^/([A-Za-z0-9_-]+)$" /$1.php last; rewrite ^ /index.php last; }
}

server { listen 80; server_name pops.example.com; return 301 https://$host$request_uri; }
