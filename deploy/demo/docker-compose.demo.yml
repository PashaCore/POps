# POps public demo (read-only): PostgreSQL, backend, panel and a fake school fleet. See README.md.
# Always run it through reset.sh / setup-host.sh, or by hand with the env file:
#     docker compose -p pops-demo --env-file .env.demo -f docker-compose.demo.yml ps
# Values come from .env.demo (generated by setup-host.sh, never committed; template: .env.demo.example).
#
# Isolation: only the panel publishes a port, on 127.0.0.1. The database, the backend and the fleet sit on an
# internal network with no route out (and no published ports). Nothing from the host is mounted except the
# read-only tools/ folder and seed.py. Memory and process limits keep the demo from crowding the host.
name: pops-demo

x-logging: &logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

# Released images on GHCR; when the tag is not published there, Compose builds the same image from this checkout.
x-backend-image: &backend-image
  image: ghcr.io/pashacore/pops-backend:${POPS_IMAGE_TAG:-local}
  build:
    context: ../..
    dockerfile: docker/backend.Dockerfile

x-db-env: &db-env
  DB_HOST: db
  DB_PORT: "5432"
  DB_USER: ${DB_USER:?set DB_USER in .env.demo}
  DB_PASS: ${DB_PASS:?set DB_PASS in .env.demo}
  DB_NAME: ${DB_NAME:?set DB_NAME in .env.demo}
  TZ: ${TZ:-Europe/Istanbul}

services:
  db:
    image: postgres:17
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40", "-c", "work_mem=4MB"]
    environment:
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env.demo}
      POSTGRES_PASSWORD: ${DB_PASS:?set DB_PASS in .env.demo}
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env.demo}
      TZ: ${TZ:-Europe/Istanbul}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 30
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m
    pids_limit: 200
    logging: *logging

  backend:
    <<: *backend-image
    restart: unless-stopped
    environment:
      <<: *db-env
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.demo}
      # Created by the backend on its first start (the password is generated by setup-host.sh)
      PANEL_ADMIN_USER: ${PANEL_ADMIN_USER:-yonetici}
      PANEL_ADMIN_PASS: ${PANEL_ADMIN_PASS:-}
      # Read-only demo accounts: every request except GET/HEAD/OPTIONS returns 403 (docs/configuration.md)
      POPS_DEMO_USERS: ${POPS_DEMO_USERS:-demo}
      CORS_ALLOWED_ORIGINS: ""
      DB_POOL_MAX: "10"
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 384m
    pids_limit: 200
    logging: *logging

  dashboard:
    image: ghcr.io/pashacore/pops-dashboard:${POPS_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: docker/dashboard.Dockerfile
    restart: unless-stopped
    environment:
      POPS_API_INTERNAL_URL: http://backend:8000
      POPS_API_URL: /api
      # Sign-in page hint "Demo: kullanıcı …, şifre … (salt okunur)"; the account itself is made by seed.py
      POPS_DEMO_LOGIN: ${POPS_DEMO_LOGIN:-demo:demo}
      POPS_TRUSTED_PROXIES: ${POPS_TRUSTED_PROXIES:-}
    ports:
      # Plain HTTP on loopback only; the host's Apache (TLS) proxies the public name to it
      - "127.0.0.1:${POPS_DEMO_PORT:-8180}:80"
    networks: [internal, edge]
    depends_on:
      backend:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 200
    logging: *logging

  fleet:
    # Python and websockets from the backend image; the simulator itself is mounted read-only from tools/.
    # It never executes commands (see the header of tools/demo_fleet.py).
    <<: *backend-image
    restart: unless-stopped
    command: ["python", "/opt/pops-tools/demo_fleet.py"]
    environment:
      DEMO_FLEET_URL: ws://backend:8000
      DEMO_ENROLL_TOKEN: ${DEMO_ENROLL_TOKEN:?set DEMO_ENROLL_TOKEN in .env.demo}
      # /app/storage is the one folder the image's user owns; the volume keeps the device keys across restarts
      DEMO_FLEET_STATE: /app/storage/demo-fleet.json
      DEMO_FLEET_SCHEDULE: ${DEMO_FLEET_SCHEDULE:-school}
      DEMO_FLEET_NIGHT_ON: ${DEMO_FLEET_NIGHT_ON:-0.4}
      DEMO_FLEET_HB: ${DEMO_FLEET_HB:-10}
      TZ: ${TZ:-Europe/Istanbul}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ../../tools:/opt/pops-tools:ro
      - fleet-state:/app/storage
    networks: [internal]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      disable: true
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    stop_grace_period: 15s
    mem_limit: 128m
    pids_limit: 100
    logging: *logging

  seed:
    # One-off (reset.sh): "docker compose run --rm seed" after the migrations, before the fleet starts
    <<: *backend-image
    profiles: ["seed"]
    restart: "no"
    working_dir: /app
    command: ["python", "/opt/pops-demo/seed.py"]
    environment:
      <<: *db-env
      PYTHONPATH: /app
      POPS_DEMO_LOGIN: ${POPS_DEMO_LOGIN:-demo:demo}
      DEMO_ENROLL_TOKEN: ${DEMO_ENROLL_TOKEN:?set DEMO_ENROLL_TOKEN in .env.demo}
      PANEL_ADMIN_USER: ${PANEL_ADMIN_USER:-yonetici}
      PANEL_ADMIN_PASS: ${PANEL_ADMIN_PASS:-}
    volumes:
      - ./seed.py:/opt/pops-demo/seed.py:ro
      - ../../tools:/opt/pops-tools:ro
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 256m
    logging: *logging

networks:
  # No route out: the database, backend and fleet cannot reach the internet or the host's other services
  internal:
    internal: true
  # Only for the panel's published port
  edge: {}

volumes:
  pgdata:
  fleet-state:
