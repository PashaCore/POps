# POps ajanı yetenekleri: bu bilgisayarın kararı. Sunucu bir yeteneği yalnızca KAPATABİLİR; açamaz.
# TERMINAL_ENABLED=0 uzaktan komutu (root olarak /bin/sh) bu bilgisayarda kalıcı olarak kapatır: panelden gelen
# komutlar "[REDDEDİLDİ]" ile döner. Değişiklikten sonra: sudo systemctl restart pops-agent
# Sunucunun kapattığı uzak komutu yeniden açmak: sudo pops-agent capabilities --reset
# Ekran görüntüleme (Vision) bu sürümde yok.
TERMINAL_ENABLED=1
