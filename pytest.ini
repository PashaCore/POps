# Backend testleri: python -m pytest (docs/testing.md). Çalışan sunucu isteyen betikler "integration" işaretlidir.
[pytest]
testpaths = Backend/tests
markers =
    integration: çalışan bir sunucuya karşı koşar (POPS_TEST_HTTP; tests/run_local.sh ya da CI başlatır)
addopts = -ra --strict-markers --strict-config
