name: POps CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Sürüm iş akışı (release.yml) yayından önce bütün testleri aynı commit'te bununla yeniden çalıştırır
  workflow_call:

permissions:
  contents: read

jobs:
  build-agent:
    name: Build ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: POps.Agent
            project: Agent/POps.Agent/POps.Agent.sln
          - name: POpsUpdater
            project: Agent/POpsUpdater/POpsUpdater.sln
          - name: POpsWatchdog
            project: Agent/POpsWatchdog/POpsWatchDog.sln
          - name: POpsTray
            project: Agent/POpsTray/POpsTray.csproj
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build "${{ matrix.project }}" --configuration Release

  test-agent:
    name: Agent unit tests
    # Ajan (net8.0-windows) ve MSI custom action'ları (net472) için xUnit testleri; yalnızca saf mantık ve
    # geçici klasörlerde dosya işlemleri (güvenlik duvarı, pipe, servis test edilmez)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Test
        # Kapsam coverlet.collector ile (iki hedef: ajan net8.0-windows ve MSI custom action'ları net472)
        run: dotnet test Agent/POps.Tests/POps.Tests.csproj --configuration Release --logger "console;verbosity=normal" --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Agent coverage summary
        if: always()
        shell: python
        env:
          PYTHONUTF8: "1"
        run: |
          import glob, os, xml.etree.ElementTree as ET
          rows = []
          for path in sorted(glob.glob("TestResults/**/coverage.cobertura.xml", recursive=True)):
              for pkg in ET.parse(path).getroot().iter("package"):
                  rows.append((pkg.get("name"), float(pkg.get("line-rate") or 0) * 100))
          lines = ["### Ajan kapsamı (satır)", "", "| Paket | Kapsam |", "|---|---|"]
          lines += ["| %s | %.1f %% |" % row for row in rows] or ["| (rapor yok) | — |"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          print("%d paket" % len(rows))
          # Taban: POpsAgent satır kapsamı bunun altına düşerse adım başarısız (docs/testing.md). Yükselince artırın.
          AGENT_FLOOR = 62.0
          agent = [rate for name, rate in rows if name == "POpsAgent"]
          if not agent:
              raise SystemExit("POpsAgent kapsam raporu yok")
          if agent[0] < AGENT_FLOOR:
              raise SystemExit("POpsAgent kapsamı %%%.1f, taban %%%.1f" % (agent[0], AGENT_FLOOR))
          print("POpsAgent kapsamı %%%.1f (taban %%%.1f)" % (agent[0], AGENT_FLOOR))
      - name: Upload agent coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: agent-coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 hedef (EL9'un python3.12 paketi, Ubuntu 24.04, Docker imajı); 3.10 en düşük desteklenen sürüm
        # (Ubuntu 22.04). İkisinde de import + birim testleri; lint yalnızca hedefte. Bkz. docs/decisions.md D-20.
        python: [ '3.12', '3.10' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: Backend/requirements.lock
      - name: Install dependencies
        # Sunucu bağımlılıkları canlıdaki gibi kilitten, SHA-256 özetleri denetlenerek. flake8 ve jsonschema (protokol
        # testi) yalnızca CI'da; canlı sunucunun venv'ine girmez.
        run: |
          pip install --require-hashes -r Backend/requirements.lock
          pip install --require-hashes -r .github/requirements/pytest.lock
          pip install flake8 jsonschema==4.26.0
      - name: Lint with flake8
        # Tam kapı: repo kökündeki .flake8 (max-line-length 120). Backend, Linux ajanı ve araçlar (tools/, README çizimleri) temiz tutulur; yeni uyarı CI'ı kırar.
        if: matrix.python == '3.12'
        run: flake8 Backend/ Agent-Linux/ tools/ assets/readme/ --count --show-source --statistics
      - name: Import smoke test
        # Modül yüklenirken zorunlu ortam değişkenleri okunur; veritabanına bağlanılmaz. (FastAPI dahil edilen
        # router'ları artık iç içe tutar; app.routes uç sayısını vermez.)
        working-directory: Backend
        env:
          JWT_SECRET: ci-only
          DB_USER: ci
          DB_PASS: ci
          DB_NAME: ci
        run: python -c "import server, setup_env; print('ok')"
      - name: Unit tests (no server)
        run: python -m pytest Backend/tests/test_units.py
      - name: OpenAPI spec is up to date
        # docs/openapi.json koddan üretilir (çalışan sunucu şemayı sunmaz). Uç ya da istek modeli değişince yeniden
        # üretilip commit'lenmeli; betik farkı görürse nasıl üretileceğini yazar ve iş kırılır.
        if: matrix.python == '3.12'
        run: |
          python tools/export_openapi.py --check || {
            echo "::error file=docs/openapi.json::docs/openapi.json is out of date. Regenerate it with 'python tools/export_openapi.py' (Python 3.12, Backend/requirements.txt installed) and commit the result."
            exit 1
          }
      - name: Agent protocol (docs/protocol)
        # Şemalar, ortak test vektörleri ve sunucunun gerçek kodunun kurduğu / işlediği mesajlar (sahte veritabanı ve
        # soketlerle); bkz. docs/protocol/README.md
        run: python -m pytest Backend/tests/test_protocol.py

  backend-lock:
    name: Backend lock file
    # Backend/requirements.lock, requirements.txt'ten yeniden üretilince aynı çıkmalı (kilitteki öteki sürümler
    # korunur; yalnızca requirements.txt'in gerektirdiği değişir). Dependabot PR'larında lock-refresh.yml kilidi
    # yeniler.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.12.23
      - name: requirements.lock is in sync with requirements.txt
        run: |
          tools/backend_lock.sh --check || {
            echo "::error file=Backend/requirements.lock::Backend/requirements.lock, requirements.txt ile uyumlu değil. Yeniden üretip commit'leyin: pip install uv==0.12.23 && tools/backend_lock.sh"
            exit 1
          }

  linux-agent:
    name: Linux agent
    # Pardus/Debian ajanı (Agent-Linux, docs/decisions.md D-22): bilgisayardakiyle aynı yığın, yani dağıtımın kendi
    # python3'ü ve python3-websockets / python3-cryptography paketleri. Birim testleri (root gerekmez), .deb'in iki
    # kez derlenip aynı baytları vermesi, dpkg -i (servis başlatılmaz: policy-rc.d), dosya izinleri ve purge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Distribution packages
        run: |
          sudo apt-get update -qq
          # python3-jsonschema yalnızca testler için (docs/protocol şemaları); pakette bağımlılık değil
          sudo apt-get install -y -qq python3-websockets python3-cryptography python3-pytest python3-jsonschema >/dev/null
          /usr/bin/python3 --version
          dpkg-query -W -f='${Package} ${Version}\n' python3-websockets python3-cryptography python3-pytest python3-jsonschema
      - name: Unit tests
        run: /usr/bin/python3 -m pytest -v -p no:cacheprovider Agent-Linux/tests
      - name: Build the .deb twice (reproducible)
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          /usr/bin/python3 Agent-Linux/build_deb.py --out "$RUNNER_TEMP/a"
          /usr/bin/python3 Agent-Linux/build_deb.py --out "$RUNNER_TEMP/b"
          cmp "$RUNNER_TEMP"/a/pops-agent_*_all.deb "$RUNNER_TEMP"/b/pops-agent_*_all.deb
          dpkg-deb --info "$RUNNER_TEMP"/a/pops-agent_*_all.deb
          dpkg-deb --contents "$RUNNER_TEMP"/a/pops-agent_*_all.deb
      - name: dpkg -i without starting the service, then purge
        run: |
          set -euo pipefail
          # deb-systemd-invoke policy-rc.d'ye uyar: paket kurulur, servis etkinleştirilir ama başlatılmaz
          printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
          sudo chmod 755 /usr/sbin/policy-rc.d
          sudo dpkg -i "$RUNNER_TEMP"/a/pops-agent_*_all.deb
          dpkg-query -W -f='${Status} ${Version}\n' pops-agent | grep '^install ok installed '
          systemctl is-enabled pops-agent.service
          if systemctl is-active -q pops-agent.service; then echo "::error::servis başlatılmamalıydı"; exit 1; fi
          test "$(sudo stat -c '%a %U' /etc/pops-agent/agent.conf)" = "600 root"
          test "$(sudo stat -c '%a' /var/lib/pops-agent)" = 700
          test "$(stat -c '%a' /usr/bin/pops-agent)" = 755
          test "$(pops-agent version)" = "$(tr -d '[:space:]' < VERSION)"
          sudo pops-agent status
          sudo dpkg --verify pops-agent
          sudo dpkg --purge pops-agent
          test ! -e /etc/pops-agent && test ! -e /var/lib/pops-agent && test ! -e /usr/lib/pops-agent
          sudo rm -f /usr/sbin/policy-rc.d

  linux-agent-backend:
    name: Linux agent against the backend
    # Uçtan uca: kaynak ağacındaki ajan (dağıtımın python3'ü) TLS'li arka uca (pops-tls ile kurum CA'sı, ajan yalnızca
    # bu CA'ya güvenir) bağlanır, kaydolur, panel cihazı Linux gösterir, komut çıkış koduyla döner, onaylanan sonuç
    # diskten silinir, kapatılan uzak komut reddedilir (Agent-Linux/tests/test_integration.py).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: pops
          POSTGRES_PASSWORD: pops
          POSTGRES_DB: pops_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: pops
      DB_PASS: pops
      DB_NAME: pops_ci
      JWT_SECRET: ci-linux-agent-secret-0123456789abcdef
      PANEL_ADMIN_USER: admin
      PANEL_ADMIN_PASS: ci-linux-agent-admin
      CORS_ALLOWED_ORIGINS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python (backend)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install backend deps and the agent's distribution packages
        run: |
          pip install --require-hashes -r Backend/requirements.lock
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-websockets python3-cryptography python3-pytest >/dev/null
      - name: Migrate, start the backend over TLS, run the agent test
        run: |
          set -euo pipefail
          python Backend/migrate.py
          export POPS_CA_DIR="$RUNNER_TEMP/ca" POPS_TLS_DIR="$RUNNER_TEMP/tls" POPS_TLS_ALLOW_NONROOT=1
          Installer/server/pops-tls init localhost 127.0.0.1
          ( cd Backend && exec python -m uvicorn server:app --host 127.0.0.1 --port 8443 \
              --ssl-certfile "$POPS_TLS_DIR/server.crt" --ssl-keyfile "$POPS_TLS_DIR/server.key" >"$RUNNER_TEMP/uvicorn.log" 2>&1 ) &
          curl --retry-connrefused --retry 40 --retry-delay 1 -sf --cacert "$POPS_CA_DIR/pops-ca.pem" \
            https://127.0.0.1:8443/api/health >/dev/null || { echo "server did not start"; cat "$RUNNER_TEMP/uvicorn.log"; exit 1; }
          POPS_IT_URL=https://127.0.0.1:8443 POPS_IT_CA="$POPS_CA_DIR/pops-ca.pem" POPS_IT_ADMIN_PASS="$PANEL_ADMIN_PASS" \
            POPS_IT_AGENT_PYTHON=/usr/bin/python3 /usr/bin/python3 -m pytest -v -p no:cacheprovider Agent-Linux/tests/test_integration.py \
            || { tail -50 "$RUNNER_TEMP/uvicorn.log"; exit 1; }

  dashboard:
    name: Dashboard checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: PHP syntax
        run: find Dashboard -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Dark mode stays removed
        run: |
          if grep -rnE "data-theme|toggleTheme" Dashboard; then
            echo "::error::Panel yalnızca açık temayı kullanır; data-theme/toggleTheme geri eklenmemeli."
            exit 1
          fi
      - name: HTML output is escaped (XSS)
        # innerHTML / insertAdjacentHTML / document.write ve PHP echo'ya kaçırılmamış veri gitmesin. Önce betiğin
        # öz sınamaları, sonra panelin kendisi; incelenmiş istisnalar tools/html_sinks/html_sinks_allowlist.txt'de.
        run: |
          python3 tools/html_sinks/test_check_html_sinks.py
          python3 tools/html_sinks/check_html_sinks.py
      - name: Translations (i18n)
        # Dashboard/lang/*/*.json: geçerli JSON, yer tutucular anahtarla aynı, her Türkçe anahtar kaynakta birebir var
        run: python3 tools/i18n/check_i18n.py
      - name: JS unit tests
        # Ortak betiğin ve sayfa betiklerinin (assets/pages) saf yardımcıları; bağımlılık yok, runner'daki node yeter
        run: node --test tests/unit-js/*.test.mjs

  panel-e2e:
    name: Panel end-to-end
    # Panelin sayfaları gerçek tarayıcıda (Playwright, yalnızca Chromium): her sayfa 1440 ve 390 piksel genişlikte
    # açılır; giriş/çıkış, Cihazlar, Sınıflar, İşlemler, Kayıtlar, Sistem, Ayarlar ve izleyici yetkisi akışları. Konsol
    # hatası, panelin kendi kökeni dışına istek ve PHP uyarısı testi düşürür. Yığını tests/e2e/global-setup.js kurar:
    # migrate.py, uvicorn (8099), seed.sql, php -S (8098) + router.php. Bkz. docs/testing.md.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: pops
          POSTGRES_PASSWORD: pops
          POSTGRES_DB: pops_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: pops
      DB_PASS: pops
      DB_NAME: pops_e2e
      E2E_PYTHON: python
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - name: Install backend deps
        run: pip install -r ../../Backend/requirements.txt
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # 2.37.2
        with:
          php-version: "8.3"
          extensions: curl
          coverage: none
          tools: none
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: npx playwright test
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: panel-e2e-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
            tests/e2e/.stack/*.log
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

  version:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Actions pinned to commit SHAs
        # R-09: bir eylemin etiketi (v4 gibi) sonradan başka bir commit'e taşınabilir; iş akışları yalnızca tam
        # commit SHA'sıyla eylem kullanır (yanına sürüm yorumu). Dependabot bu satırları SHA olarak günceller.
        run: |
          set -euo pipefail
          bad=$(grep -nE '^\s*(-\s*)?uses:\s*[^.[:space:]][^@[:space:]]*@' .github/workflows/*.yml \
                | grep -vE '@[0-9a-f]{40}(\s|$)' || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "::error::Eylemler tam commit SHA'sıyla sabitlenmeli (örn. actions/checkout@<40 hane>  # v4.4.0)."
            exit 1
          fi
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: VERSION == CHANGELOG == Directory.Build.props
        # Tek sürüm kaynağı bozulmasın: kök VERSION, CHANGELOG'un en üst sürüm başlığı ve
        # Directory.Build.props'un ürettiği <Version> birbirini tutmazsa derleme kırılır.
        run: |
          set -euo pipefail
          VER=$(tr -d '[:space:]' < VERSION)
          echo "VERSION dosyası:          $VER"
          TOP=$(grep -oP '^## \[\K[^]]+' CHANGELOG.md | grep -vx 'Unreleased' | head -1)
          echo "CHANGELOG en üst sürüm:   $TOP"
          if [ "$VER" != "$TOP" ]; then
            echo "::error::VERSION ($VER) ile CHANGELOG'un en üst sürüm başlığı ($TOP) uyuşmuyor."
            exit 1
          fi
          # net8.0 (Windows'a bağımlı olmayan) POpsUpdater üzerinden Directory.Build.props'un
          # ürettiği <Version>'ı Linux'ta değerlendir; ajan assembly'lerine giden değer budur.
          BUILT=$(dotnet msbuild Agent/POpsUpdater/POpsUpdater/POpsUpdater.csproj -getProperty:Version -nologo | tr -d '[:space:]')
          echo "Directory.Build.props:    $BUILT"
          if [ "$VER" != "$BUILT" ]; then
            echo "::error::VERSION ($VER) ile derlenen <Version> ($BUILT) uyuşmuyor."
            exit 1
          fi
          echo "Sürüm tutarlı: $VER"
      - name: Docs state the current versions
        # Belgeler (README, ROADMAP, docs/, sürüm notu) sürümü, Python/PostgreSQL alt sınırını ve ajanın .NET'ini
        # tek kaynaklardan (VERSION, requirements.txt, migrations işi, csproj) farklı söylemesin. setup-python gerekmez.
        run: python3 tools/check_docs_versions.py

  migrations:
    name: Migrations (PostgreSQL 13)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: pops
          POSTGRES_PASSWORD: pops
          POSTGRES_DB: pops_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: pops
      DB_PASS: pops
      DB_NAME: pops_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: pip install --require-hashes -r Backend/requirements.lock
      - name: Fresh migrate + schema check + idempotency
        # Boş bir veritabanında migrate.py tüm şemayı kurmalı, şema kontrolünü geçmeli
        # ve ikinci çalıştırma hiçbir şey uygulamamalı (idempotent).
        run: |
          set -euo pipefail
          echo "== 1. calistirma (bos DB)"
          python Backend/migrate.py
          echo "== sema dogrulama"
          python .github/scripts/ci_schema_check.py
          echo "== 2. calistirma (idempotent olmali)"
          out=$(python Backend/migrate.py)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q "yok (her sey guncel)" || { echo "::error::Migration idempotent degil"; exit 1; }

  backup-restore:
    name: Backup and restore (PostgreSQL 16)
    # pops-backup / pops-restore gerçekten çalışıyor mu: yedek + sınama, kurcalanmış zincir reddi, geri dönüş.
    # Runner'daki pg_dump 16 olduğu için sunucu da 16 (betikler PostgreSQL 13+ ister; üretim 13'te).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pops
          POSTGRES_PASSWORD: pops
          POSTGRES_DB: pops_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: pops
      DB_PASS: pops
      DB_NAME: pops_ci
      JWT_SECRET: ci-backup-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install --require-hashes -r Backend/requirements.lock
          sudo apt-get install -y -qq postgresql-client >/dev/null
          pg_dump --version
      - name: Migrate and write audit entries
        working-directory: Backend
        run: |
          python migrate.py
          python - <<'PY'
          import asyncio, asyncpg
          from pops import db
          from pops.audit import add_audit_log
          from pops.config import DB_CONFIG
          async def main():
              db.db_pool = await asyncpg.create_pool(**DB_CONFIG, min_size=1, max_size=2)
              for i in range(5):
                  await add_audit_log("HW-CI-BACKUP", "ci_seed", "yedek testi", {"i": i})
          asyncio.run(main())
          PY
      - name: Backup, tamper, restore
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/app"; mkdir -p "$APP"; cp -a Backend/. "$APP/"
          printf 'DB_HOST=%s\nDB_PORT=%s\nDB_USER=%s\nDB_PASS=%s\nDB_NAME=%s\nJWT_SECRET=%s\n' \
            "$DB_HOST" "$DB_PORT" "$DB_USER" "$DB_PASS" "$DB_NAME" "$JWT_SECRET" > "$APP/.env"
          mkdir -p "$APP/storage"; echo "ci-storage" > "$APP/storage/ci.txt"
          CONF="$RUNNER_TEMP/backup.conf"
          cat > "$CONF" <<CONF
          POPS_APP=$APP
          POPS_SERVICE=
          POPS_SERVICE_USER=
          POPS_PYTHON=$(command -v python)
          BACKUP_DIR=$RUNNER_TEMP/backups
          STATUS_FILE=$RUNNER_TEMP/backups/status.json
          PGADMIN_CMD="psql -h 127.0.0.1 -U pops -d postgres -X -q -v ON_ERROR_STOP=1"
          CONF
          export POPS_BACKUP_CONF="$CONF" POPS_BACKUP_ALLOW_NONROOT=1 PGPASSWORD=pops
          # Uygulama dizinindeki .env'deki DB_* değerleri kullanılır; job ortamındakiler betiği etkilemesin
          unset DB_HOST DB_PORT DB_USER DB_PASS DB_NAME JWT_SECRET

          echo "== 1. yedek (sınamalı)"
          Installer/server/pops-backup
          cat "$RUNNER_TEMP/backups/status.json"
          grep -q '"ok":true' "$RUNNER_TEMP/backups/status.json"
          grep -q '"verified":true' "$RUNNER_TEMP/backups/status.json"
          FIRST=$(ls -d "$RUNNER_TEMP"/backups/20*Z | head -1)
          tar -tzf "$FIRST/files.tgz" | grep -q 'storage/ci.txt'

          echo "== bozuk özet reddedilmeli"
          cp -a "$FIRST" "$RUNNER_TEMP/tampered-copy"
          echo x >> "$RUNNER_TEMP/tampered-copy/meta.json"
          if Installer/server/pops-restore --check "$RUNNER_TEMP/tampered-copy"; then echo "::error::bozuk yedek kabul edildi"; exit 1; fi

          echo "== denetim kaydı kurcalanınca yeni yedek sınamadan geçmemeli"
          psql -h 127.0.0.1 -U pops -d pops_ci -X -q -c "UPDATE device_audit_logs SET reason='degistirildi' WHERE id = (SELECT min(id) FROM device_audit_logs WHERE action='ci_seed')"
          sleep 1
          if Installer/server/pops-backup; then echo "::error::kurcalanmış zincirle yedek 'tamam' dedi"; exit 1; fi
          grep -q '"ok":false' "$RUNNER_TEMP/backups/status.json"

          echo "== ilk yedeğe geri dönüş (--db-only)"
          sudo -E env "PATH=$PATH" Installer/server/pops-restore --yes --db-only "$FIRST"
          test "$(psql -h 127.0.0.1 -U pops -d pops_ci -X -A -t -c "SELECT count(*) FROM device_audit_logs WHERE reason='degistirildi'")" = 0
          ( cd "$APP" && python audit_verify.py )

  tls:
    name: TLS tool and nginx template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: pops-tls init / show / renew, chain and name checks
        run: |
          set -euo pipefail
          export POPS_CA_DIR=$RUNNER_TEMP/ca POPS_TLS_DIR=$RUNNER_TEMP/tls POPS_TLS_ALLOW_NONROOT=1
          T=Installer/server/pops-tls
          $T init pops.okul.local 10.0.0.5
          $T show
          openssl verify -CAfile "$POPS_CA_DIR/pops-ca.pem" "$POPS_TLS_DIR/server.crt"
          san=$(openssl x509 -in "$POPS_TLS_DIR/server.crt" -noout -ext subjectAltName)
          grep -q 'DNS:pops.okul.local' <<<"$san" && grep -q 'IP Address:10.0.0.5' <<<"$san"
          openssl x509 -in "$POPS_CA_DIR/pops-ca.pem" -noout -ext basicConstraints | grep -q 'CA:TRUE'
          test "$(stat -c %a "$POPS_CA_DIR/ca.key")" = 600 && test "$(stat -c %a "$POPS_TLS_DIR/server.key")" = 600
          before=$(sha256sum "$POPS_TLS_DIR/server.crt")
          $T renew | grep -q 'gerek yok'
          test "$before" = "$(sha256sum "$POPS_TLS_DIR/server.crt")"
          $T renew --force
          test "$before" != "$(sha256sum "$POPS_TLS_DIR/server.crt")"
          openssl verify -CAfile "$POPS_CA_DIR/pops-ca.pem" "$POPS_TLS_DIR/server.crt"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -keyout "$RUNNER_TEMP/other.key" -out "$RUNNER_TEMP/other.pem" -days 1 -subj "/CN=Other CA" 2>/dev/null
          if openssl verify -CAfile "$RUNNER_TEMP/other.pem" "$POPS_TLS_DIR/server.crt" 2>/dev/null; then echo "::error::yabancı CA kabul edildi"; exit 1; fi
          if $T import "$RUNNER_TEMP/other.pem" "$POPS_TLS_DIR/server.key" 2>/dev/null; then echo "::error::eşleşmeyen anahtar kabul edildi"; exit 1; fi
      - name: nginx template renders and validates
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq nginx >/dev/null
          mkdir -p "$RUNNER_TEMP/dash" && touch "$RUNNER_TEMP/php.sock"
          # nginx göreli include'ları (fastcgi_params) ana yapılandırmanın klasöründe arar
          cp /etc/nginx/fastcgi_params "$RUNNER_TEMP/"
          sed -e "s#@DOMAIN@#pops.okul.local#g" -e "s#@DASHBOARD@#$RUNNER_TEMP/dash#g" -e "s#@PHP_SOCK@#$RUNNER_TEMP/php.sock#g" \
              -e "s#@CERT@#$RUNNER_TEMP/tls/server.crt#g" -e "s#@KEY@#$RUNNER_TEMP/tls/server.key#g" -e "s#@PORT@#8000#g" \
              Installer/server/nginx.pops.conf.in > "$RUNNER_TEMP/pops.conf"
          printf 'events {}\nhttp { include %s; }\n' "$RUNNER_TEMP/pops.conf" > "$RUNNER_TEMP/nginx.conf"
          sudo nginx -t -c "$RUNNER_TEMP/nginx.conf"

  server-scripts:
    name: Server scripts
    # Installer/server betikleri: shellcheck + pops-deploy-backend / pops-selfupdate davranış testleri (geçici
    # dizinlerde, systemctl/curl/sudo/journalctl/pip/python taklitleriyle, root olmadan): normal deploy, sağlık
    # kontrolü / pip / kopyalama hatasında kod ve venv'in birebir geri dönüşü, venv'in Python'u eskiyse yeni venv
    # (yorumlayıcı yoksa erken hata), ayar dosyası, imzalı sürüm etiketleri, DRYRUN.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: shellcheck
        run: |
          set -euo pipefail
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck >/dev/null; }
          shellcheck --version | head -2
          mapfile -t scripts < <(find Installer/server -maxdepth 1 -type f -name 'pops-*' ! -name '*.*' | sort)
          scripts+=(tools/backend_lock.sh)
          # Uyarı ve hatalar kırar; "info" ve "style" notları (ör. SC2015, sürüme göre değişir) yalnızca raporlanır
          shellcheck --severity=info Installer/server/install.sh Installer/server/tests/*.sh "${scripts[@]}" docker/dashboard-entrypoint.sh Backend/tests/run_local.sh || true
          shellcheck --severity=warning Installer/server/install.sh Installer/server/tests/*.sh "${scripts[@]}" docker/dashboard-entrypoint.sh Backend/tests/run_local.sh
      - name: Deploy and self-update tests
        run: bash Installer/server/tests/test_deploy.sh

  signing:
    name: Release signing tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install cryptography
        run: pip install 'cryptography==43.0.3'
      - name: sign_release selftest
        # Geçici anahtarla imzala/doğrula, kurcalanmış manifest ve bozuk artefakt reddedilmeli.
        # Gerçek imza anahtarı (secret) gerekmez.
        run: python tools/sign_release.py selftest

  security:
    name: Security invariants (integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: pops
          POSTGRES_PASSWORD: pops
          POSTGRES_DB: pops_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: pops
      DB_PASS: pops
      DB_NAME: pops_ci
      JWT_SECRET: ci-test-secret
      CORS_ALLOWED_ORIGINS: ""
      POPS_TEST_HTTP: http://127.0.0.1:8099
      # test_features.py kendi webhook alıcısını 127.0.0.1'de açar
      NOTIFY_WEBHOOK_ALLOW_PRIVATE: "1"
      # test_ops.py /metrics'i bu jetonla okur (sunucu ile aynı değer)
      METRICS_TOKEN: ci-metrics-token-0123456789
      # test_demo.py: bu hesap salt okunur demo hesabıdır (sunucu ve test aynı değeri okur)
      POPS_DEMO_USERS: ci_demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install backend deps
        # coverage ve jsonschema yalnızca CI'da (canlı sunucunun venv'ine girmez)
        run: |
          pip install --require-hashes -r Backend/requirements.lock
          pip install --require-hashes -r .github/requirements/pytest.lock
          pip install coverage==7.10.7 jsonschema==4.26.0
      - name: Migrate + start server + run security invariants
        # Enroll->secret, enforce->4401, valid secret ok, unauth HTTP 401, wrong-signature
        # upload rejected — hepsi çalışan sunucuya karşı doğrulanır. Sunucu coverage altında çalışır.
        run: |
          set -euo pipefail
          python Backend/migrate.py
          ( cd Backend && POPS_TEST_COVERAGE=1 python -m coverage run --rcfile=.coveragerc -m pytest -q -m "not integration" tests )
          ( cd Backend && exec python -m coverage run --rcfile=.coveragerc -m uvicorn server:app --host 127.0.0.1 --port 8099 >/tmp/uvicorn.log 2>&1 ) &
          echo $! > /tmp/uvicorn.pid
          curl --retry-connrefused --retry 40 --retry-delay 1 -sf http://127.0.0.1:8099/api/health >/dev/null || { echo "server did not start"; cat /tmp/uvicorn.log; exit 1; }
          # Backend/tests'teki betikler (conftest.py): bilinen sırayla, her biri ayrı süreçte
          python -m pytest -v -m integration
      - name: Backend coverage
        # Alt sınır (fail_under) kapsamın fark edilmeden düşmesini engeller; kapsam arttıkça yükseltin.
        # Hangi kritik yolların test edildiği: docs/testing.md
        run: |
          set -euo pipefail
          kill -TERM "$(cat /tmp/uvicorn.pid)"
          for _ in $(seq 1 20); do kill -0 "$(cat /tmp/uvicorn.pid)" 2>/dev/null || break; sleep 0.5; done
          cd Backend
          python -m coverage combine --rcfile=.coveragerc
          python -m coverage xml --rcfile=.coveragerc -o coverage.xml
          { echo '### Backend kapsamı'; echo '```'; python -m coverage report --rcfile=.coveragerc; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --rcfile=.coveragerc --fail-under=65
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: backend-coverage
          path: Backend/coverage.xml
          if-no-files-found: ignore
