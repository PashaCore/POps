name: Release

# v* etiketi push edildiğinde kurulum dosyalarını (sunucu paketi, ajan MSI'ı ve ajan zip'i) derler
# ve tek bir GitHub Release olarak yayımlar. Bu dosya main'de değiştiğinde paketler yalnızca
# derlenir (yayımlanmaz), böylece iş akışı etiket atılmadan denenebilir.
on:
  push:
    tags: [ "v*" ]
    branches: [ "main" ]
    paths: [ ".github/workflows/release.yml" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent:
    name: Agent package (win-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish agent components into one folder
        # Framework'e bağımlı derleme: uç noktalarda .NET 8 Desktop Runtime (x64) gerekir.
        # Güncelleme Merkezi paketi C:\POps içine açar, bu yüzden dosyalar ZIP'in köküne konur.
        shell: pwsh
        run: |
          $out = "dist/POps"
          $projects = @(
            "Agent/POps.Agent/POps.Agent/POpsAgent.csproj",
            "Agent/POpsTray/POpsTray.csproj",
            "Agent/POpsWatchdog/POpsWatchDog/POpsWatchDog.csproj",
            "Agent/POpsUpdater/POpsUpdater/POpsUpdater.csproj"
          )
          foreach ($p in $projects) {
            dotnet publish $p -c Release -r win-x64 --self-contained false -o $out
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Remove-Item "$out/*.pdb" -ErrorAction SilentlyContinue
          Get-ChildItem $out | Select-Object Name, Length | Format-Table -AutoSize
      - name: Zip
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") { $ver = $env:GITHUB_REF_NAME.TrimStart("v") }
          else { $ver = "dev-" + $env:GITHUB_SHA.Substring(0, 7) }
          Compress-Archive -Path "dist/POps/*" -DestinationPath "POps-Agent-$ver-win-x64.zip"
      - name: MSI
        # WiX 5, NuGet'ten sabit sürümle gelir (Installer/agent/POps.Agent.Installer.wixproj). MSI yalnızca
        # sayısal sürüm kabul eder: VERSION'ın a.b.c kısmı + çalışma numarası, böylece her derleme bir
        # öncekini yükseltir. appsettings*.json pakete girmez; ayarları kurulum yazar.
        shell: pwsh
        run: |
          $raw = (Get-Content VERSION -Raw).Trim()
          if ($raw -notmatch '^(\d+)\.(\d+)\.(\d+)') { throw "VERSION sayısal bir a.b.c ile başlamıyor: $raw" }
          $msiVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3]).$env:GITHUB_RUN_NUMBER"
          if ($env:GITHUB_REF_TYPE -eq "tag") { $ver = $env:GITHUB_REF_NAME.TrimStart("v") }
          else { $ver = "dev-" + $env:GITHUB_SHA.Substring(0, 7) }
          $publishDir = (Resolve-Path "dist/POps").Path + "\"
          dotnet build Installer/agent/POps.Agent.Installer.wixproj -c Release "-p:PopsPublishDir=$publishDir" "-p:ProductVersion=$msiVersion" -o msi-out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item msi-out/POps-Agent.msi "POps-Agent-$ver-win-x64.msi"
          Write-Host "MSI $msiVersion -> POps-Agent-$ver-win-x64.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: agent
          path: |
            POps-Agent-*-win-x64.msi
            POps-Agent-*-win-x64.zip
          if-no-files-found: error

  server:
    name: Server package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package backend and dashboard
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VER="${GITHUB_REF_NAME#v}"; else VER="dev-${GITHUB_SHA::7}"; fi
          NAME="pops-server-$VER"
          mkdir -p "dist/$NAME"
          cp -r Backend Dashboard docs keys VERSION .env.example CHANGELOG.md LICENSE README.md SECURITY.md "dist/$NAME/"
          rm -rf "dist/$NAME/Backend/__pycache__"
          tar -C dist -czf "$NAME.tar.gz" "$NAME"
          tar -tzf "$NAME.tar.gz" | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: pops-server-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [ agent, server ]
    runs-on: ubuntu-latest
    # İmza anahtarına yalnızca bu iş erişir. Anahtarı "release" GitHub Environment'ının
    # secret'ı yapın ve environment'a "required reviewers" koruması ekleyin; böylece
    # imzalı yayın, elle onay olmadan tetiklenemez. (GitHub → Settings → Environments)
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag == VERSION == CHANGELOG
        # Etiket, kök VERSION dosyası ve CHANGELOG başlığı birbirini tutmazsa yayım durur.
        run: |
          set -euo pipefail
          VER=$(tr -d '[:space:]' < VERSION)
          if [ "$GITHUB_REF_NAME" != "v$VER" ]; then
            echo "::error::Etiket ($GITHUB_REF_NAME) ile VERSION (v$VER) uyuşmuyor; etiketi 'v$VER' olarak atın."
            exit 1
          fi
          if ! grep -q "^## \[$VER\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md içinde '## [$VER]' başlığı yok."
            exit 1
          fi
          echo "Sürüm tutarlı: v$VER"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sign release manifest (ed25519)
        # Tüm paketlerin SHA-256'sını + sürüm + tag + zaman damgasını içeren manifest'i
        # imzalar ve depodaki açık anahtarla doğrular. Özel anahtar yalnızca bu secret'tan gelir.
        env:
          POPS_RELEASE_PRIVATE_KEY: ${{ secrets.POPS_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${POPS_RELEASE_PRIVATE_KEY:-}" ]; then
            echo "::error::POPS_RELEASE_PRIVATE_KEY secret'ı tanımlı değil; imzasız release yayımlanmaz."
            echo "Kurulum: 'python tools/sign_release.py genkey --out-dir keys' ile üretilen özel PEM'i bu secret'a ekleyin (açık anahtar keys/pops_release_ed25519.pub.pem repoda)."
            exit 1
          fi
          python -m pip install --quiet 'cryptography==43.0.3'
          VER=$(tr -d '[:space:]' < VERSION)
          python tools/sign_release.py sign --dir dist --version "$VER" --tag "$GITHUB_REF_NAME"
          python tools/sign_release.py verify --dir dist --pub-pem keys/pops_release_ed25519.pub.pem
      - name: Checksums and release notes
        run: |
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          VER="${GITHUB_REF_NAME#v}"
          {
            echo "> **İmzalı sürüm (ed25519).** \`manifest.json\` ve \`manifest.json.sig\` release'e dahildir; açık anahtar depoda \`keys/pops_release_ed25519.pub.pem\`. Doğrulama için bkz. \`keys/README.md\`. Ajan için \`POps-Agent-*-win-x64.msi\` önerilir (sessiz kurulum ve özellikleri: \`Installer/README.md\`); zip eski elle kurulum yoludur. Ajan paketleri Windows'ta SmartScreen uyarısı verebilir (Authenticode ayrı); uç noktalarda .NET 8 Desktop Runtime (x64) gerekir."
            echo
            awk -v v="$VER" 'index($0, "## [" v "]") == 1 {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md
          } > notes.md
          cat notes.md
      - name: Publish
        # Üçüncü taraf action, repoya yazma yetkisiyle çalıştığı için commit SHA'sına sabitlenmiştir
        # (Dependabot sürümü günceller)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: dist/*
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
