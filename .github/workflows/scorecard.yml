name: Scorecard

# OpenSSF Scorecard: deponun tedarik zinciri pratiklerini (dal koruması, sabitlenmiş eylemler, token yetkileri,
# imzalı sürümler, bağımlılık güncellemeleri...) puanlar. Sonuç Security → Code scanning'e yüklenir ve
# api.scorecard.dev'e yayımlanır (README rozeti). Yayımlama iş akışına kural koyar: üst düzeyde env/defaults ve
# yazma yetkisi yok, id-token yalnızca bu işte, bu işte env/defaults/container yok ve yalnızca onaylı eylemler
# (checkout, upload-artifact, codeql upload-sarif, scorecard-action). Yeni adım eklerken buna uyun.
on:
  # Branch-Protection kontrolü kural değişince yenilensin (yalnızca varsayılan dal desteklenir)
  branch_protection_rule:
  # Maintained kontrolü düzenli yenilensin
  schedule:
    - cron: "41 4 * * 2"
  push:
    branches: [ "main" ]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Sonucu Code scanning'e yüklemek için
      security-events: write
      # Sonucu yayımlamak ve rozet için (GitHub OIDC jetonu; publish_results)
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      # SARIF dosyası Actions sekmesinde 5 gün durur (hata ayıklama için)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          sarif_file: results.sarif
