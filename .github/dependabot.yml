version: 2
updates:
  - package-ecosystem: pip
    directory: /Backend
    schedule:
      interval: weekly
    # Backend Python 3.10+ ister (D-20); 3.10'u bırakan bir sürüm gelirse CI'ın 3.10 işi kırılır, önce o karar verilir.
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    # CI araçları (.github/requirements/*.txt); özetli kilitlerini Dependabot PR'ında lock-refresh.yml yeniler. Haftada
    # tek PR.
    directory: /.github/requirements
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      ci-tools:
        patterns: [ "*" ]
    ignore:
      # uv elle yükseltilir: kilitlerin biçimi uv sürümüne bağlı (lock-tools.txt)
      - dependency-name: uv

  - package-ecosystem: docker
    # docker/*.Dockerfile taban imajları özetle (sha256) sabit; aynı etiketin yeni özeti haftalık gelir.
    directory: /docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # Python 3.12 (D-20) ve PHP 8.3 (CI'ın sınadığı) bilinçli seçimdir; sürüm geçişi elle yapılır
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: php
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: nuget
    directories:
      - /Agent/POps.Agent/POps.Agent
      - /Agent/POpsUpdater/POpsUpdater
      - /Agent/POpsWatchdog/POpsWatchDog
      - /Agent/POpsTray
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Ajan net10.0 hedefliyor (LTS, self-contained); .NET 11 kütüphanelerine (major bump) geçmek build'i kırar.
      # Minor/patch (10.0.x) güncellemeleri gelmeye devam eder; büyük sürüm geçişi bir sonraki LTS'yle elle yapılır.
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Win32.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    # Yalnızca panelin uçtan uca testleri (Playwright, tam sürüm + package-lock.json); panelin kendisi npm kullanmaz
    directory: /tests/e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
