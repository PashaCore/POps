version: 2
updates:
  - package-ecosystem: pip
    directory: /Backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Backend Python 3.9'u (AlmaLinux/RHEL 9'un sistem Python'u; canlı sunucu ve install.sh) destekler. Bu sürümler
      # Python 3.10 ister; backend daha yeni bir Python'a geçince (ROADMAP) kaldırılır.
      - dependency-name: "fastapi"
        versions: [">=0.129"]
      - dependency-name: "uvicorn"
        versions: [">=0.40"]
      - dependency-name: "python-dotenv"
        versions: [">=1.2.2"]
      - dependency-name: "python-multipart"
        versions: [">=0.0.21"]

  - package-ecosystem: nuget
    directories:
      - /Agent/POps.Agent/POps.Agent
      - /Agent/POpsUpdater/POpsUpdater
      - /Agent/POpsWatchdog/POpsWatchDog
      - /Agent/POpsTray
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Ajan net10.0 hedefliyor (LTS, self-contained); .NET 11 kütüphanelerine (major bump) geçmek build'i kırar.
      # Minor/patch (10.0.x) güncellemeleri gelmeye devam eder; büyük sürüm geçişi bir sonraki LTS'yle elle yapılır.
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Win32.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
