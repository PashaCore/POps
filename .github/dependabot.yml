version: 2
updates:
  - package-ecosystem: pip
    directory: /Backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: nuget
    directories:
      - /Agent/POps.Agent/POps.Agent
      - /Agent/POpsVision/POpsVision
      - /Agent/POpsUpdater/POpsUpdater
      - /Agent/POpsWatchdog/POpsWatchDog
      - /Agent/POpsTray
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Ajan net8.0 hedefliyor; .NET 10 kütüphanelerine (major bump) geçmek build'i kırar.
      # Minor/patch güncellemeleri gelmeye devam eder; major geçiş .NET 10 migration'ıyla yapılır.
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Win32.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
